name: Build Windows DLL (local test)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build DLL
        shell: pwsh
        run: |
          cd go
          go build -buildmode=c-shared -tags driverlib -o adbc_driver_bigquery-0.21.0.dev+dbt0.21.9.dll ./pkg

      - uses: actions/upload-artifact@v4
        with:
          name: bigquery-driver-dll
          path: go/adbc_driver_bigquery-0.21.0.dev+dbt0.21.9.dll
          retention-days: 7
